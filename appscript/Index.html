<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Dude Store Build</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap">

<style>
  :root{
    --bg:#ffffff;
    --ink:#160F24;
    --ink-soft:#3A3150;
    --muted:#78708A;
    --line:#ECE7F5;
    --chip:#F8F5FE;
    --primary:#7C3AED;
    --primary-2:#9D5CFF;
    --primary-ink:#ffffff;
    --glow:rgba(124,58,237,.30);
    --glow-soft:rgba(124,58,237,.14);
    --ok:#159E6B;
    --err:#D64545;
    --code-bg:#150E24;
    --code-ink:#FFFFFF;
    --code-line:#2A2140;
    --font:"Space Grotesk", ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;line-height:1.5}
  ::selection{background:var(--primary);color:#fff}

  .wrap{position:relative;max-width:920px;margin:0 auto;padding:0 20px;padding-block:34px 64px}
  .wash{position:absolute;top:-40px;left:50%;transform:translateX(-50%);width:min(1000px,120%);height:560px;background:radial-gradient(46% 52% at 80% 16%, rgba(157,92,255,.16), transparent 70%), radial-gradient(40% 46% at 14% 30%, var(--glow-soft), transparent 72%);pointer-events:none;z-index:0}

  /* ---- scroll-to-prompt button ---- */
  .scrolltop{position:relative;z-index:2;display:flex;justify-content:center;margin-bottom:26px}
  .scrollbtn{
    display:inline-flex;align-items:center;gap:10px;font-family:var(--font);
    font-size:13.5px;font-weight:600;letter-spacing:.02em;color:var(--primary);cursor:pointer;
    background:#fff;border:1px solid #E4D9F7;border-radius:100px;padding:11px 20px;
    animation:pulseGlow 2.4s ease-in-out infinite;
    transition:transform .16s ease, background .2s ease;
  }
  .scrollbtn:hover{transform:translateY(-2px);background:var(--chip)}
  .scrollbtn:active{transform:translateY(0)}
  .scrollbtn:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
  .scrollbtn .chev{display:grid;place-items:center;animation:bob 1.4s ease-in-out infinite}
  .scrollbtn .chev svg{width:16px;height:16px}
  @keyframes pulseGlow{
    0%,100%{box-shadow:0 8px 22px -8px var(--glow), 0 0 0 0 rgba(124,58,237,.30)}
    50%{box-shadow:0 12px 30px -6px var(--glow), 0 0 0 9px rgba(124,58,237,0)}
  }
  @keyframes bob{0%,100%{transform:translateY(-2px)}50%{transform:translateY(3px)}}
  @media (prefers-reduced-motion:reduce){.scrollbtn,.scrollbtn .chev{animation:none}}

  /* ---- hero (text left, photo right) ---- */
  .hero{position:relative;z-index:1;margin-top:8px;display:grid;grid-template-columns:1.05fr .95fr;gap:44px;align-items:center}
  .hero-text{text-align:left;min-width:0}
  .tag{
    display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:500;
    letter-spacing:.12em;text-transform:uppercase;color:var(--primary);
    background:var(--chip);border:1px solid #E4D9F7;padding:6px 13px;border-radius:100px;
    box-shadow:0 6px 18px var(--glow-soft);
  }
  .tag .dot{width:6px;height:6px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 3px var(--glow-soft)}
  h1{font-size:clamp(32px,4.8vw,46px);line-height:1.04;font-weight:700;letter-spacing:-.03em;margin:18px 0 0;text-wrap:balance}
  h1 em{font-style:normal;color:var(--primary);text-shadow:0 0 34px rgba(124,58,237,.32)}
  .sub{margin:16px 0 0;max-width:46ch;font-size:clamp(15px,2.1vw,16.5px);color:var(--ink-soft);font-weight:400}

  /* feature list */
  .feats{margin-top:24px;display:flex;flex-direction:column;gap:11px}
  .feat{display:flex;align-items:center;gap:12px;font-size:15px;font-weight:500;color:var(--ink)}
  .feat .fi{
    width:28px;height:28px;border-radius:9px;flex:none;display:grid;place-items:center;color:#fff;
    background:linear-gradient(150deg,var(--primary-2),var(--primary));box-shadow:0 7px 16px -2px var(--glow);
  }
  .feat .fi svg{width:15px;height:15px}

  .price{
    margin:24px auto 0;display:flex;flex-direction:column;align-items:center;gap:2px;width:max-content;max-width:100%;
    padding:16px 30px;border-radius:18px;background:var(--chip);border:1px solid var(--line);
    box-shadow:0 14px 38px var(--glow-soft);
  }
  .price .row{display:inline-flex;align-items:baseline;gap:8px}
  .price .cur{font-size:20px;font-weight:500;color:var(--muted);transform:translateY(-9px)}
  .price .amt{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1}
  .price .gst{font-size:14px;font-weight:500;color:var(--muted)}
  .price .note{font-size:12.5px;color:var(--muted);letter-spacing:.02em}

  .callout{margin-top:18px;display:inline-flex;align-items:center;gap:12px;font-size:14.5px;color:var(--ink-soft);text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px}
  .callout b{color:var(--ink);font-weight:600}
  .callout .ic{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;color:#fff;background:linear-gradient(150deg,var(--primary-2),var(--primary));box-shadow:0 8px 20px var(--glow)}
  .callout .ic svg{width:17px;height:17px}

  /* ---- photo (rectangle, right side) ---- */
  .shot{margin:0;display:flex;flex-direction:column;gap:14px}
  .shot .frame{
    position:relative;width:100%;aspect-ratio:3/3.55;border-radius:24px;overflow:hidden;
    background:#ffffff;
    box-shadow:0 30px 72px -26px var(--glow), 0 0 0 1px var(--line);
  }
  .shot .glow{position:absolute;inset:auto -6% -26% -6%;height:60%;background:radial-gradient(62% 88% at 50% 100%, rgba(124,58,237,.34), rgba(124,58,237,.10) 46%, transparent 74%);z-index:0}
  .shot img{
    position:absolute;inset:0;z-index:1;display:block;width:100%;height:100%;
    object-fit:contain;object-position:center bottom;
  }
  .shot .cap{position:relative;z-index:1;text-align:center}
  .shot .cap .name{font-size:17px;font-weight:600;letter-spacing:-.01em}
  .shot .cap .role{font-size:13px;color:var(--muted);margin-top:2px}

  /* ---- included ---- */
  .included{margin-top:40px;max-width:760px;margin-inline:auto}
  .included .cap{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--primary);text-align:center;margin-bottom:16px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .inc{display:flex;align-items:flex-start;gap:10px;padding:13px 14px;background:#fff;border:1px solid var(--line);border-radius:13px}
  .inc .tick{width:20px;height:20px;flex:none;border-radius:6px;display:grid;place-items:center;color:#fff;background:linear-gradient(150deg,var(--primary-2),var(--primary));margin-top:1px}
  .inc .tick svg{width:12px;height:12px}
  .inc div.t{font-size:13.5px;font-weight:500;color:var(--ink);line-height:1.35}
  .inc div.t span{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:2px}

  /* ---- form ---- */
  .card{position:relative;overflow:hidden;margin-top:38px;max-width:560px;margin-inline:auto;background:#fff;border:1px solid var(--line);border-radius:24px;padding:32px 28px 28px;box-shadow:0 30px 70px -34px var(--glow), 0 2px 8px -4px rgba(22,15,36,.06)}
  .card::before{content:"";position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--primary-2),var(--primary))}
  .card::after{content:"";position:absolute;top:-70px;right:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,var(--glow-soft),transparent 68%);pointer-events:none}
  .form-badge{position:relative;z-index:1;display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--primary);background:var(--chip);border:1px solid #E4D9F7;padding:6px 12px;border-radius:100px;margin-bottom:14px;box-shadow:0 6px 16px var(--glow-soft)}
  .form-badge svg{width:13px;height:13px}
  .card h2{position:relative;z-index:1;margin:0 0 4px;font-size:24px;font-weight:700;letter-spacing:-.02em}
  .card .lead{position:relative;z-index:1;margin:0 0 22px;font-size:14px;color:var(--muted)}

  .field{margin-bottom:15px;display:flex;flex-direction:column;gap:7px}
  .field label{font-size:12.5px;font-weight:600;letter-spacing:.02em;color:var(--ink-soft)}
  .control{position:relative}
  .control .lead-ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:#A79FB8;pointer-events:none;transition:color .15s}
  .control:focus-within .lead-ic{color:var(--primary)}
  .field input{font-family:var(--font);font-size:15.5px;color:var(--ink);background:#FCFBFE;border:1px solid var(--line);border-radius:13px;padding:14px 14px 14px 42px;outline:none;width:100%;transition:border-color .15s, box-shadow .15s, background .15s}
  .field input::placeholder{color:#B4AEC2}
  .field input:hover{border-color:#DBD3EC}
  .field input:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px var(--glow-soft)}
  .field.bad input{border-color:var(--err)}
  .field.bad .lead-ic{color:var(--err)}
  .field.bad input:focus{box-shadow:0 0 0 4px rgba(214,69,69,.14)}
  .err{font-size:12px;color:var(--err);min-height:2px}

  .submit{margin-top:8px;width:100%;font-family:var(--font);font-size:16px;font-weight:600;letter-spacing:.01em;color:var(--primary-ink);border:none;border-radius:13px;padding:16px 18px;cursor:pointer;background:linear-gradient(150deg,var(--primary-2),var(--primary));box-shadow:0 12px 30px -6px var(--glow), inset 0 1px 0 rgba(255,255,255,.25);transition:transform .12s ease, box-shadow .2s ease, filter .2s;display:inline-flex;align-items:center;justify-content:center;gap:9px}
  .submit:hover{transform:translateY(-1px);box-shadow:0 18px 40px -8px var(--glow)}
  .submit:active{transform:translateY(0)}
  .submit:disabled{filter:saturate(.7) opacity(.8);cursor:default;transform:none}
  .submit svg{width:17px;height:17px}
  .fineprint{margin:14px 2px 0;font-size:12px;color:var(--muted);text-align:center}

  /* ---- success ---- */
  .done{text-align:center;padding:12px 6px 6px}
  .done .check{width:64px;height:64px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;color:#fff;background:linear-gradient(150deg,var(--primary-2),var(--primary));box-shadow:0 14px 34px var(--glow);animation:pop .4s cubic-bezier(.2,1.2,.4,1) both}
  .done .check svg{width:29px;height:29px}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .done h2{margin:0 0 8px;font-size:23px;font-weight:600}
  .done p{margin:0 auto;max-width:38ch;color:var(--ink-soft);font-size:15px}
  .done .again{margin-top:22px;background:none;border:1px solid var(--line);font-family:var(--font);font-size:14px;font-weight:500;color:var(--ink-soft);padding:11px 18px;border-radius:11px;cursor:pointer;transition:border-color .15s,color .15s}
  .done .again:hover{border-color:var(--primary);color:var(--primary)}

  /* ---- spec ---- */
  .spec{margin-top:48px}
  .spec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px}
  .spec-head h3{margin:0;font-size:16px;font-weight:600;letter-spacing:-.01em}
  .spec-head p{margin:4px 0 0;font-size:13px;color:var(--muted);max-width:44ch}
  .copy{flex:none;font-family:var(--font);font-size:13px;font-weight:500;color:var(--primary);background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:9px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:border-color .15s}
  .copy:hover{border-color:var(--primary)}
  .copy svg{width:14px;height:14px}
  .codebox{background:var(--code-bg);border:1px solid var(--code-line);border-radius:16px;overflow:hidden}
  .codebox .bar{display:flex;align-items:center;gap:7px;padding:12px 16px;border-bottom:1px solid var(--code-line)}
  .codebox .bar i{width:11px;height:11px;border-radius:50%;background:#3a3150;display:block}
  .codebox .bar span{margin-left:8px;font-size:12px;color:#8B82A8;font-weight:400}
  pre.code{margin:0;padding:18px 18px 22px;max-height:420px;overflow:auto;font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;font-size:12.5px;line-height:1.6;color:var(--code-ink);white-space:pre;tab-size:2}
  pre.code::-webkit-scrollbar{width:10px;height:10px}
  pre.code::-webkit-scrollbar-thumb{background:#372c52;border-radius:8px;border:2px solid var(--code-bg)}

  footer{margin-top:38px;text-align:center;font-size:12.5px;color:var(--muted)}
  footer b{color:var(--ink-soft);font-weight:600}

  @media (max-width:760px){
    .hero{grid-template-columns:1fr;gap:26px}
    .hero-text{text-align:center;order:2}
    .shot{order:1}
    .shot .frame{max-width:320px;margin:0 auto}
    .feats{align-items:flex-start;max-width:340px;margin-inline:auto}
    .feat{width:100%;text-align:left}
  }
  @media (max-width:460px){
    .wrap{padding-block:26px 52px}
    .card{padding:24px 18px 22px}
    .grid{grid-template-columns:1fr}
    .spec-head{flex-direction:column;align-items:stretch}
    .copy{align-self:flex-start}
  }
</style>
</head>

<script type="text/plain" id="spec-src">Build a full-stack Diwali crackers (fireworks) e-commerce store, production-ready,
deployed on a Hostinger VPS.

STACK
- Frontend: Next.js 14+ (App Router), TypeScript, Tailwind CSS
- Backend: Next.js API routes (or a separate Express API if you think it's cleaner
  for this scale - explain your reasoning briefly before committing to one)
- Database: PostgreSQL (Prisma as ORM)
- Payments: Razorpay (live integration - I will provide real API keys via .env,
  never hardcode any keys, use environment variables throughout, and never log
  secret keys)
- Email: Nodemailer via SMTP (credentials via env vars - I'll provide real SMTP
  credentials)

CORE FEATURES (build in stages, confirm each stage works before moving to the next)

1. PROJECT SETUP
   - Scaffold Next.js + TypeScript + Tailwind project
   - Set up Prisma with PostgreSQL, initial schema (below)
   - .env.example documenting every required variable
   - Clean folder structure: /app, /components, /lib, /prisma, /deploy

2. DATABASE SCHEMA (Prisma)
   - Product: id, name, description, price, category (sparklers, rockets,
     flowerpots, chakras, combo-packs, etc.), imageUrl, stockQuantity, isActive
   - Order: id, customerName, customerPhone, customerEmail, deliveryAddress,
     totalAmount, paymentStatus (pending/paid/failed), razorpayOrderId,
     razorpayPaymentId, createdAt
   - OrderItem: id, orderId, productId, quantity, priceAtPurchase
   - Seed script with realistic sample crackers products across categories

3. PRODUCT CATALOG
   - Homepage: hero banner + product grid, filterable by category
   - Product card: image, name, price, stock status, "Add to Cart"
   - Fully responsive, mobile-first (most customers will order from phone)
   - Handle out-of-stock state clearly (disable add-to-cart, show badge)

4. CART
   - React Context or Zustand for cart state, persisted in localStorage
   - Add/remove/update quantity, respect stock limits
   - Cart drawer/page with line items, quantity controls, subtotal

5. CHECKOUT FLOW
   - Collect customerName, phone, email, delivery address
   - Server-side validation (required fields, phone format, email format) -
     do not rely on client-side validation alone
   - Create Order + OrderItems in DB with paymentStatus = "pending" BEFORE
     opening Razorpay checkout
   - Recalculate the total server-side from DB prices at order-creation time -
     never trust a client-submitted total

6. RAZORPAY INTEGRATION (live)
   - Backend: API route to create a Razorpay order (razorpay.orders.create)
     using the server-calculated total, return order_id to frontend
   - Frontend: Razorpay Checkout.js integration using that order_id
   - Backend: payment verification API route - verify Razorpay signature via
     HMAC (crypto), never trust a client-side "success" callback alone
   - Set up a Razorpay webhook endpoint as the source of truth for payment
     status (in addition to the checkout callback), verifying the webhook
     signature, since callbacks can be missed or spoofed
   - On verified successful payment: update Order to "paid", store
     razorpayPaymentId, decrement product stockQuantity atomically (use a DB
     transaction to prevent overselling under concurrent orders)
   - Handle payment failure/cancellation: update order status accordingly,
     show a clear error, don't leave ambiguous "pending" orders unresolved

7. ORDER CONFIRMATION + DELIVERY EMAIL
   - On verified successful payment, send confirmation email to the customer:
     order number, items, total paid, delivery address, delivery estimate
   - Send a separate notification email to the store owner (admin email from
     env) with full order details
   - On-screen order confirmation page after payment success with order ID
     and summary
   - Make email sending resilient: if SMTP fails, log the error and don't
     fail the whole order - the payment is already captured, so the order
     must still be saved and visible to the admin

8. ADMIN AREA
   - /admin route, protected with authentication (do not ship this without
     auth - use a simple username/password with hashed credentials, or
     NextAuth if that's less work)
   - List orders with status, search/filter, view order detail
   - Ability to update product stock and add/edit/deactivate products

SECURITY (required, not optional - treat this as a checklist to satisfy, not
general guidance)

Secrets & config
   - All secrets (DB URL, Razorpay keys, SMTP credentials, admin session
     secret) via environment variables only - nothing hardcoded, nothing
     ever logged (including in error logs/stack traces)
   - .env is git-ignored; .env.example lists variable names only, no real
     values
   - Separate Razorpay test-mode and live-mode key handling - fail loudly at
     startup if live keys look like test keys (e.g. key prefix check) so a
     misconfigured deploy can't silently take real payments with test keys
     or vice versa

Input handling & injection
   - Validate and sanitize every user-submitted field server-side (checkout
     form, admin forms) - reject unexpected types/lengths, not just "trim
     and hope"
   - All DB access through Prisma's parameterized queries - no raw SQL string
     concatenation anywhere
   - Sanitize/escape anything rendered from user input (product reviews if
     added later, order notes, etc.) to prevent stored XSS

Payment integrity
   - Recalculate order total server-side from DB prices at order-creation
     time - never trust a client-submitted amount
   - Verify Razorpay payment signature via HMAC (crypto.createHmac) on both
     the checkout callback AND the webhook - never mark an order "paid" on
     an unverified client callback alone
   - Verify the Razorpay webhook signature using the webhook secret before
     processing any webhook payload
   - Idempotency: a retried/duplicate webhook call for the same payment must
     not double-decrement stock, double-send email, or create a duplicate
     "paid" state - check current order status before acting
   - Stock decrement on payment success must run inside a DB transaction
     with row-level locking (or equivalent) to prevent overselling when two
     customers buy the last unit concurrently

API & rate limiting
   - Rate limit checkout creation, payment verification, and admin login
     routes specifically (these are the abuse targets) - not just a blanket
     global limiter
   - CSRF protection on state-changing routes if using cookie-based sessions
   - Proper HTTP status codes and generic error messages to the client;
     detailed errors go to server logs only, never to the response body in
     production

Admin area
   - /admin routes protected by authentication on every route (middleware-
     level, not per-page checks that are easy to forget on a new page)
   - Passwords hashed with bcrypt/argon2, never stored or logged in plaintext
   - Session cookies: httpOnly, secure, sameSite - no tokens in localStorage
     for the admin session
   - Lock out or throttle repeated failed admin login attempts

Headers & transport
   - Set standard security headers (Content-Security-Policy,
     X-Content-Type-Options, X-Frame-Options, Referrer-Policy) via
     next.config or middleware
   - Code should assume HTTPS in production (secure cookies, no mixed
     content) - actual SSL termination happens at Nginx/certbot on the VPS

Dependencies & surface area
   - No unused/unnecessary npm packages - smaller dependency surface
   - Flag in DEPLOY.md: run npm audit before first production deploy and
     after any dependency changes

   After this stage, give me a short written summary of every security
   control actually implemented (not just planned) so I can verify nothing
   here was skipped.

TESTING
   - Manual test checklist per stage, specific enough that I can verify each
     feature works as built
   - Explicit checklist for the full payment path: successful payment,
     failed payment, cancelled payment, and a simulated webhook retry
   - Flag any part of the flow that really should have automated tests before
     go-live (e.g. stock-decrement concurrency, signature verification) even
     if we're not writing the full suite in this pass

DEPLOYMENT (Hostinger VPS)
   - Production build script
   - PM2 ecosystem config (ecosystem.config.js) to run the app as a managed,
     auto-restarting process
   - Nginx reverse-proxy config (/deploy/nginx.conf) - port 80/443 → app port,
     with a note on enabling SSL via certbot
   - DEPLOY.md with exact steps: clone repo, install deps, configure .env on
     server, run Prisma migrations against the production DB, build, start
     with PM2, configure Nginx + SSL
   - Do not attempt to SSH or deploy anywhere yourself - prepare these files
     only. I will handle the actual deploy to the VPS.

WORKING STYLE
   - Go stage by stage. After each stage, stop, summarize what you built, give
     me the manual test steps for that stage, and wait for me to confirm
     before continuing.
   - Keep commits small and scoped per stage.
   - Clearly flag anything still using a placeholder value so I know what to
     replace before this goes live to real customers.

STYLE / UI
   - Use Space Grotesk font, white background, glowing purple as the primary
     colour, minimalistic UI. Use React.</script>

<script>
(function(){

  var useState = React.useState;
  var PHOTO = "data:image/png;base64," + document.getElementById("photo-data").textContent.trim();

  function icon(children, extra){
    var props = Object.assign({viewBox:"0 0 24 24", fill:"none", stroke:"currentColor",
      strokeWidth:2, strokeLinecap:"round", strokeLinejoin:"round"}, extra||{});
    return h.apply(null, ["svg", props].concat(children));
  }
  var Ic = {
    phone: function(){ return icon([h("path",{key:0,d:"M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.6A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.4-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"})]); },

  var INCLUDED = [
    ["Mobile-first storefront", "Fast, responsive design your customers buy from on any phone"],
    ["Product catalog", "Categories, images, prices and clear in-stock / sold-out states"],
    ["Cart & checkout", "Smooth add-to-cart and a checkout that just works"],
    ["Live Razorpay payments", "Real UPI, cards & netbanking - money straight to your account"],
    ["Order & delivery emails", "Auto confirmation to customers, alerts to you on every order"],
    ["Admin dashboard", "Manage orders, update stock and edit products yourself"],
    ["Secure by default", "Verified payments, protected admin, safe handling of every input"],
    ["Deployed on your VPS", "Set up to run on your own Hostinger server - you own the code"]
  ];

  function validate(v){
    var e = {};
    if(!v.name || v.name.trim().length < 2) e.name = "Please enter your name.";
    var email = (v.email||"").trim();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) e.email = "Enter a valid email address.";
    var digits = (v.phone||"").replace(/\D/g,"");
    if(!(digits.length === 10 || (digits.length === 12 && digits.indexOf("91") === 0)))
      e.phone = "Enter a 10-digit phone number.";
    return e;
  }

  function Field(p){
    return h("div", {className:"field" + (p.error ? " bad" : "")},
      h("label", {htmlFor:p.id}, p.label),
      h("div", {className:"control"},
        p.icon ? h("span", {className:"lead-ic"}, p.icon) : null,
        h("input", {id:p.id, name:p.id, type:p.type, placeholder:p.placeholder,
          value:p.value, onChange:p.onChange, inputMode:p.inputMode,
          autoComplete:p.autoComplete, "aria-invalid": !!p.error})
      ),
      h("div", {className:"err"}, p.error || "")
    );
  }

  function App(){
    var fs = useState({name:"", email:"", phone:""}), form = fs[0], setForm = fs[1];
    var es = useState({}), errors = es[0], setErrors = es[1];
    var bs = useState(false), busy = bs[0], setBusy = bs[1];
    var ds = useState(false), done = ds[0], setDone = ds[1];
    var cs = useState(false), copied = cs[0], setCopied = cs[1];

    var specText = document.getElementById("spec-src").textContent;

    function set(k){
      return function(e){
        var val = e.target.value;
        setForm(function(f){ var n = Object.assign({}, f); n[k] = val; return n; });
        if(errors[k]){ setErrors(function(er){ var n = Object.assign({}, er); n[k] = undefined; return n; }); }
      };
    }

    function submit(e){
      e.preventDefault();
      var errs = validate(form);
      setErrors(errs);
      if(Object.keys(errs).some(function(k){ return errs[k]; })) return;
      setBusy(true);
      google.script.run
        .withSuccessHandler(function(){ setBusy(false); setDone(true); })
        .withFailureHandler(function(err){ setBusy(false); alert("Sorry, something went wrong sending your details. Please try again."); })
        .submitLead({ name: form.name.trim(), email: form.email.trim(), phone: form.phone.trim() });
    }

    function reset(){ setForm({name:"", email:"", phone:""}); setErrors({}); setDone(false); }

    function scrollToSpec(){
      var el = document.querySelector(".spec");
      if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
    }

    function copySpec(){
      var txt = document.getElementById("spec-src").textContent;
      var ok = function(){ setCopied(true); setTimeout(function(){ setCopied(false); }, 1800); };
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(txt).then(ok).catch(function(){});
      } else {
        try{
          var r = document.createRange();
          r.selectNodeContents(document.querySelector("pre.code"));
          var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
        }catch(_){}
      }
    }

    var firstName = (form.name.trim().split(" ")[0]) || "friend";

    return h("div", {className:"wrap"},
      h("div", {className:"wash"}),
      h("div", {className:"scrolltop"},
        h("button", {className:"scrollbtn", type:"button", onClick:scrollToSpec},
          "Scroll down for the prompt",
          h("span", {className:"chev"}, Ic.chevron())
        )
      ),
      /* hero: text left, photo right */
      h("div", {className:"hero"},
        h("div", {className:"hero-text"},
          h("h1", null, "Build & launch your eCommerce store ", h("em", null, "in half a day"), "."),
          h("p", {className:"sub"},
            "Complete, done-for-you setup - storefront, live payments, order emails and admin. Ready to take orders the same day."),
          h("div", {className:"feats"},
            h("div", {className:"feat"}, h("span", {className:"fi"}, Ic.box()), "Complete end-to-end setup"),
            h("div", {className:"feat"}, h("span", {className:"fi"}, Ic.clock()), "Ship your eCommerce store in half a day"),
            h("div", {className:"feat"}, h("span", {className:"fi"}, Ic.spark()), "Secure payments + admin dashboard")
          ),
          h("div", {className:"callout"},
            h("span", {className:"ic"}, Ic.phone()),
            h("span", null, "Starts with a ", h("b", null, "free 10-min 1:1"), " with AI Dude about your business.")
          ),
          h("div", {className:"price"},
            h("div", {className:"row"},
              h("span", {className:"cur"}, "₹"),
              h("span", {className:"amt"}, "9,999"),
              h("span", {className:"gst"}, "+ GST")
            ),
            h("div", {className:"note"}, "One flat price · everything included")
          )
        ),
        h("figure", {className:"shot"},
          h("div", {className:"frame"},
            h("div", {className:"glow"}),
            h("img", {src:PHOTO, alt:"AI Dude"})
          ),
          h("figcaption", {className:"cap"},
            h("div", {className:"name"}, "Manoj Kumar - The AI Dude")
          )
        )
      ),

      /* form */
      h("div", {className:"card"},
        !done
          ? h(F, null,
              h("span", {className:"form-badge"}, Ic.call(), "Free 10-min 1:1 included"),
              h("h2", null, "Book your build"),
              h("p", {className:"lead"}, "Drop your details and AI Dude will call to set up your free 10-minute session."),
              h("form", {onSubmit:submit, noValidate:true},
                h(Field, {id:"name", label:"Full name", type:"text", placeholder:"Your name", icon:Ic.user(),
                  value:form.name, onChange:set("name"), error:errors.name, autoComplete:"name"}),
                h(Field, {id:"email", label:"Email", type:"email", placeholder:"you@gmail.com", icon:Ic.mail(),
                  value:form.email, onChange:set("email"), error:errors.email, inputMode:"email", autoComplete:"email"}),
                h(Field, {id:"phone", label:"Phone number", type:"tel", placeholder:"10-digit mobile number", icon:Ic.call(),
                  value:form.phone, onChange:set("phone"), error:errors.phone, inputMode:"tel", autoComplete:"tel"}),
                h("button", {className:"submit", type:"submit", disabled:busy},
                  busy ? "Sending…" : h(F, null, "Book my build ", Ic.arrow()))
              )
            )
          : h("div", {className:"done"},
              h("div", {className:"check"}, Ic.check()),
              h("h2", null, "You're on the list, " + firstName + " 🎉"),
              h("p", null, "AI Dude will reach out shortly to lock in your free 10-minute call and kick off your store build."),
              h("button", {className:"again", onClick:reset}, "Submit another response")
            )
      ),

      /* spec */
      h("div", {className:"spec"},
        h("div", {className:"spec-head"},
          h("div", null,
            h("h3", null, "The exact build spec we ship"),
            h("p", null, "This is the full, production-grade brief AI Dude works from - copy it, tweak it, make it yours.")
          ),
          h("button", {className:"copy", onClick:copySpec},
            copied ? h(F, null, Ic.check(), " Copied") : h(F, null, Ic.copy(), " Copy spec"))
        ),
        h("div", {className:"codebox"},
          h("div", {className:"bar"}, h("i"), h("i"), h("i"), h("span", null, "ecommerce-build.prompt")),
          h("pre", {className:"code"}, specText)
        )
      )
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>

</body>
</html>
